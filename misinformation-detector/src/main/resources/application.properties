spring.config.import=optional:file:.env[.properties]

gemini.api.key=${GEMINI_API_KEY:}
server.port=${PORT:8080}

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/truthlens}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

supabase.url=${SUPABASE_URL:https://example.supabase.co}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_URL:https://example.supabase.co}/auth/v1

supabase.anon-key=${SUPABASE_ANON_KEY:anon-key}